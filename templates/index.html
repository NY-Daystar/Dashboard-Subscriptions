<!DOCTYPE html>
{% extends "layout.html" %} {% block content %}

<script src="{{url_for('static', filename='index.js')}}" defer></script>

<h2 class="mb-3">Subscription list</h2>

<div class="d-flex">
	<button
		class="btn btn-primary mb-3 ms-auto"
		data-bs-toggle="modal"
		data-bs-target="#addModal"
	>
		Add new subscription
	</button>
</div>

<table class="table table-bordered table-striped" id="itemsTable">
	<thead>
		<tr>
			<th>Name</th>
			<th>Price</th>
			<th>Frequency</th>
			<th>Payment provider</th>
			<th style="width: 120px">Actions</th>
		</tr>
	</thead>
	<tbody>
		{% for item in items %}
		<tr data-index="{{ loop.index0 }}">
			<td>{{ item.name }}</td>
			<td>{{ item.price }}</td>
			<td>{{ item.frequency }}</td>
			<td>MA SOURCE</td>
			<td>
				<button class="btn btn-danger btn-sm delete-btn">Delete</button>
			</td>
		</tr>
		{% endfor %}
	</tbody>
</table>

<div
	class="modal fade"
	id="addModal"
	tabindex="-1"
	aria-labelledby="addModalLabel"
	aria-hidden="true"
>
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title" id="addModalLabel">
					Add new subscription
				</h5>
				<button
					type="button"
					class="btn-close"
					data-bs-dismiss="modal"
				></button>
			</div>

			<form id="addForm">
				<div class="modal-body">
					<div class="mb-3">
						<label class="form-label">Name</label>
						<input
							type="text"
							class="form-control"
							name="name"
							required
						/>
					</div>

					<div class="mb-3">
						<label class="form-label">Price</label>
						<input
							type="number"
							step="0.01"
							class="form-control"
							name="price"
							required
						/>
					</div>

					<div class="mb-3">
						<label class="form-label">Payment provider</label>
						<input
							type="text"
							class="form-control"
							name="provider"
						/>
					</div>

					<div class="mb-3">
						<label class="form-label">Période</label>
						<input
							type="text"
							class="form-control"
							name="frequency"
							required
						/>
					</div>
				</div>

				<div class="modal-footer">
					<button
						type="button"
						class="btn btn-secondary"
						data-bs-dismiss="modal"
					>
						Annuler
					</button>
					<button type="submit" class="btn btn-primary">
						Ajouter
					</button>
				</div>
			</form>
		</div>
	</div>
</div>

{% endblock %}
