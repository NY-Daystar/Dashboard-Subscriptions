<!DOCTYPE html>
<html lang="fr">
	<head>
		<meta charset="UTF-8" />
		<title>{{application}}</title>

		<link
			rel="shortcut icon"
			href="{{ url_for('static', filename='favicon.ico') }}"
		/>

		<link
			rel="stylesheet"
			href="{{ url_for('static', filename='layout.css') }}"
		/>

		<link
			rel="stylesheet"
			href="{{ url_for('static',
		filename='bootstrap/bootstrap.min.css') }}"
		/>
		<script src="{{ url_for('static',
		filename='bootstrap/bootstrap.bundle.min.js') }}"></script>
	</head>

	<body class="bg-light">
		{% include "navbar.html" %}
		<div id="version">v{{version}}</div>

		<div class="container">{% block content %}{% endblock %}</div>
	</body>
</html>
